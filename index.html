<title>GuitarLab</title>

<style>
:root{--bg:#080a0e;--panel:#11151b;--panel2:#181d25;--line:#28313b;--text:#f7f8fa;--muted:#929ca8;--orange:#ff7818;--orange2:#ff9d52;--green:#35d07f;--red:#ff5050}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%;overscroll-behavior:none}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit}button{color:inherit}
.app{min-height:100vh;background:radial-gradient(circle at 50% -10%,#342013 0,#080a0e 38%)}
header{height:66px;padding:12px 18px 8px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:#090b0edb;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #ffffff08}
.logo{font-weight:900;font-size:22px;letter-spacing:.3px}.logo i{font-style:normal;color:var(--orange)}
.header-right{display:flex;gap:8px}.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#12161c;display:grid;place-items:center}
main{padding:8px 15px 105px;max-width:720px;margin:auto}.page{display:none}.page.active{display:block}
h1{font-size:29px;margin:8px 2px 4px}h2{font-size:20px;margin:0 0 13px}h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);margin:0 2px 18px}
.card{background:linear-gradient(145deg,#141920,#0f1318);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 14px 35px #0005}
.grid{display:grid;gap:11px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:#12171e;border:1px solid var(--line);border-radius:17px;padding:16px;min-height:112px;text-align:left}.tile:active,.btn:active,.navbtn:active{transform:scale(.98)}.tile .emoji{font-size:24px;display:block;margin-bottom:12px}.tile b{font-size:15px}.tile small{display:block;color:var(--muted);margin-top:5px;line-height:1.25}
.btn{border:1px solid var(--line);background:#191f27;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--orange);border-color:var(--orange);color:#111}.ghost{background:transparent}.danger{background:#321617;border-color:#653034;color:#ff9898}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:#141920;border:1px solid var(--line);color:var(--orange);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-top:4px;margin-bottom:8px}
.controls{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.center{text-align:center}
input[type=text],input[type=number],select,textarea{width:100%;background:#0b0e12;color:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}textarea{min-height:180px;resize:vertical}label{display:block;color:#aeb7c1;font-size:12px;font-weight:700;margin:12px 0 6px}.range{width:100%;accent-color:var(--orange)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0d11eF;border-top:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.navbtn{background:transparent;border:0;border-radius:13px;padding:7px 2px;color:#7f8995;font-size:10px}.navbtn .ni{display:block;font-size:21px;line-height:23px;margin-bottom:2px}.navbtn.active{color:#fff;background:#1a1f26}.navbtn.active .ni{color:var(--orange)}
.hero{padding:20px 16px;border-radius:21px;background:linear-gradient(135deg,#1d1712,#11151b);border:1px solid #3b2b20;margin:10px 0 14px}.hero h2{font-size:25px;margin-bottom:6px}.hero p{color:var(--muted);margin:0;line-height:1.4}
